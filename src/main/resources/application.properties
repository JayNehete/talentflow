# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/talentflow
spring.datasource.username=jaynehete
spring.datasource.password=jaynehete
spring.jpa.database=POSTGRESQL
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

#Actuator
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

info.app.name=TalentFlow
info.app.description=TalentFlow is a platform for managing talent acquisition and recruitment processes.
info.app.version=1.0.0

management.info.env.enabled=true
management.endpoint.shutdown.enabled=true
server.shutdown=graceful